# Project-wide Gradle settings.
#
# These are non-secret build settings and are intentionally tracked in git --
# the build does not work without them (AGP requires android.useAndroidX).
#
# Signing secrets are NOT here. Put KEEPIX_KEYSTORE_FILE, KEEPIX_KEYSTORE_PASSWORD,
# KEEPIX_KEY_ALIAS and KEEPIX_KEY_PASSWORD in ~/.gradle/gradle.properties, which
# Gradle merges automatically and which is outside this repository. See
# docs/keystore-generation.md.

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
